<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Willkommen - Strohm</title>
    <link href="/assets/css/notifications.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #4A95C7 0%, #38f9d7 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .welcome-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .company-logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 40px;
            background: #f8f9fa;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #495057;
            letter-spacing: 2px;
            border: 2px solid #e9ecef;
        }

        .welcome-title {
            font-size: 32px;
            font-weight: 300;
            color: #2d3748;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .welcome-subtitle {
            font-size: 16px;
            color: #718096;
            margin-bottom: 50px;
            line-height: 1.5;
        }

        .login-button {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: #FA4E1D;
            color: white;
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            border: none;
            cursor: pointer;
        }

        .login-button:hover {
            /*background: #38f9d7;*/
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .idp-icon {
            width: 32px;
            height: 30px;
            background: white;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #667eea;
            font-size: 12px;
        }

        .footer {
            margin-top: 50px;
            font-size: 14px;
            color: #a0aec0;
            text-decoration: none;
        }

        .footer-text {
            margin-bottom: 8px;
        }

        .footer a {
            color: #a0aec0;
            transition: color 0.2s ease;
            margin-top: 50px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .welcome-container {
                padding: 40px 24px;
                margin: 20px;
            }

            .footer {
                font-size: 12px;
            }

            .company-logo {
                width: 100px;
                height: 100px;
                margin-bottom: 30px;
                font-size: 20px;
            }

            .welcome-title {
                font-size: 28px;
                margin-bottom: 12px;
            }

            .welcome-subtitle {
                font-size: 15px;
                margin-bottom: 40px;
            }

            .login-button {
                padding: 14px 28px;
                font-size: 15px;
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .welcome-container {
                padding: 32px 20px;
            }

            .company-logo {
                width: 80px;
                height: 80px;
                font-size: 18px;
                margin-bottom: 24px;
            }

            .welcome-title {
                font-size: 24px;
            }

            .welcome-subtitle {
                font-size: 14px;
                margin-bottom: 32px;
            }
        }

        /* Animation */
        .welcome-container {
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
<div class="welcome-container">
    <div class="company-logo">
        <!--        <img src="assets/img/logo.png" alt="Company Logo" >-->
        STROHM
    </div>

    <h1 class="welcome-title">Willkommen</h1>
    <p class="welcome-subtitle">
        Melden Sie sich mit Ihrem Hochschule München Account an, um fortzufahren.
    </p>

    <a class="login-button" href="/login">
        Anmeldung mit
        <div class="idp-icon">
            <img alt="HM Logo" height="24" src="assets/img/HMacronym.svg" width="26">
        </div>
    </a>
    <div class="footer">
        <p class="footer-text">© 2025 MINcom Smart Solutions GmbH. All rights reserved.</p>
        <a href="https://min2sol.com/datenschutz/" rel="noopener noreferrer" target="_blank">Datenschutz</a>
    </div>

</div>
<script src="/assets/js/notifications.js"></script>
</body>
</html>
