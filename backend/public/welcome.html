<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Munich University of Applied Sciences - Ladeportal</title>
    <link href="/assets/css/notifications.css" rel="stylesheet">
    <link href="https://sso.hm.edu/idp/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://sso.hm.edu/idp/css/hm.css" rel="stylesheet">
    <link href="https://mediapool.hm.edu/media/_technik/img/_technik_1/favicon.jpg" rel="icon" type="image/x-icon">
    <script defer src="https://sso.hm.edu/idp/js/dark-mode-switch.min.js"></script>
    <link href="/assets/css/fonts.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="d-flex col-md-7 col-lg-6 col-xl-5 justify-content-center">
            <div id="logo"></div>
        </div>
    </div>
    <div class="row justify-content-center mb-4">
        <div class="col-md-7 col-lg-6 col-xl-5 text-center">
            <h1 class="mt-3">Ladeportal</h1>
        </div>
    </div>
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6 col-xl-5  ml-md-auto mb-2">
            <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                <a class="btn btn-hm" href="/login">Anmelden</a>
            </div>
        </div>
    </div>
    <div class="form-check form-switch d-flex justify-content-center mt-4 mb-lg-1">
        <input class="form-check-input pd-2" id="darkSwitch" type="checkbox"/>
        <label class="custom-control-label" for="darkSwitch" style="margin-left: 4px;">Dark Theme</label>
    </div>
</div>
<div style="position: fixed; bottom: 20px; right: 20px;">
    <a class="btn btn-hm" href="/faq">FAQ</a>
</div>
<script src="/assets/js/notifications.js"></script>
</body>
</html>
