<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Einwilligung erforderlich</title>
    <link href="/consent/consent.css" rel="stylesheet">
    <link href="/assets/css/notifications.css" rel="stylesheet">
    <link href="/assets/css/fonts.css" rel="stylesheet">
    <link href="https://sso.hm.edu/idp/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://sso.hm.edu/idp/css/hm.css" rel="stylesheet">
    <link href="https://mediapool.hm.edu/media/_technik/img/_technik_1/favicon.jpg" rel="icon" type="image/x-icon">
    <script defer src="https://sso.hm.edu/idp/js/dark-mode-switch.min.js"></script>
    <style>
        .consent-document {
            margin-bottom: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }

        .consent-document-header {
            background: #f9f9f9;
            padding: 12px 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .consent-document-header h3 {
            margin: 0;
            font-size: 1.1rem;
            display: inline;
        }

        .consent-document-header .meta {
            font-size: 0.85rem;
            color: #666;
        }

        .consent-pdf-frame {
            width: 100%;
            height: 450px;
            border: none;
        }

        .consent-text-content {
            max-height: 450px;
            overflow-y: auto;
            padding: 20px;
            background: #f9f9f9;
            font-size: 1rem;
            line-height: 1.4rem;
        }

        .consent-type-label {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .consent-type-agb {
            background: #d1ecf1;
            color: #0c5460;
        }

        .consent-type-datenschutz {
            background: #d4edda;
            color: #155724;
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="d-flex col-md-7 col-lg-6 col-xl-5 justify-content-center">
            <div id="logo"></div>
        </div>
    </div>
    <div class="row mt-4">
        <div class="col-12 text-center">
            <h1 class="mb-3">Einwilligung erforderlich</h1>
            <p class="text-muted">Bitte lesen und akzeptieren Sie die folgenden Dokumente, um fortzufahren.</p>
        </div>
    </div>

    <div class="row mb-3">
        <div class="col-12 col-lg-10 offset-lg-1 col-xl-8 offset-xl-2" id="consentDocuments">
        </div>
    </div>

    <form action="/consent/" id="consentForm" method="POST">
        <input id="consentIdsInput" name="consent_ids" type="hidden" value="">

        <div class="row mb-3">
            <div class="col-12 col-lg-10 offset-lg-1 col-xl-8 offset-xl-2">
                <div class="form-check checkbox-group"
                     style="border: 1px solid #e0e0e0; padding: 15px; font-size: 1rem; line-height: 1.4rem;">
                    <input class="form-check-input" id="consent_checkbox" name="consent_given" type="checkbox">
                    <label class="form-check-label" for="consent_checkbox">
                        Ich habe die oben genannten Dokumente (AGB und Datenschutzerklärung) gelesen und stimme ihnen
                        zu.
                        Mir ist bekannt, dass ich meine Zustimmung jederzeit widerrufen kann.
                    </label>
                </div>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-12 col-lg-10 offset-lg-1 col-xl-8 offset-xl-2">
                <div class="d-grid gap-2 d-md-flex justify-content-md-between">
                    <button class="btn btn-secondary" id="declineBtn" type="button">
                        Ablehnen und Abmelden
                    </button>
                    <button class="btn btn-hm" disabled id="submitBtn" type="submit">
                        Akzeptieren und fortfahren
                    </button>
                </div>
            </div>
        </div>

        <div id="error" style="display: none; color: #dc3545; margin-top: 10px; text-align: center;"></div>
    </form>
</div>
<div style="position: fixed; bottom: 20px; right: 20px;">
    <a class="btn btn-hm" href="/faq">FAQ</a>
</div>

<script>
    <!-- @formatter:off-->
    let consentDocs = {{CONSENT_DATA}}; //FIXME: Clunky injection
    let TYPE_LABELS = {'agb': 'AGB', 'datenschutz': 'Datenschutz'};

    function escapeHtml(text) {
        let div = document.createElement('div');
        div.appendChild(document.createTextNode(text));
        return div.innerHTML;
    }

    function renderConsentDocuments() {
        let container = document.getElementById('consentDocuments');
        let ids = [];

        consentDocs.forEach(function (doc) {
            ids.push(doc.id);
            let docEl = document.createElement('div');
            docEl.className = 'consent-document';

            let typeClass = 'consent-type-' + doc.type;
            let typeLabel = TYPE_LABELS[doc.type] || doc.type;
            let contentHtml;

            if (!doc.hasPdf) {
                console.log('NO PDF')
            }


            if (doc.hasPdf) {
                contentHtml = '<iframe class="consent-pdf-frame" src="/consent/pdf/' + doc.id +
                    '" title="' + typeLabel + '"></iframe>';
            } else {
                contentHtml = '<div class="consent-text-content">Dokument nicht verfügbar</div>';
            }

            docEl.innerHTML =
                '<div class="consent-document-header">' +
                '<div><span class="consent-type-label ' + typeClass + '">' + typeLabel + '</span> ' +
                '<h3>' + escapeHtml(doc.title) + '</h3></div>' +
                '<div class="meta">Version: ' + escapeHtml(doc.version) +
                ' | Aktualisiert: ' + escapeHtml(doc.updatedAt) + '</div>' +
                '</div>' + contentHtml;

            container.appendChild(docEl);
        });

        document.getElementById('consentIdsInput').value = JSON.stringify(ids);
    }

    renderConsentDocuments();

    let checkbox = document.getElementById('consent_checkbox');
    let submitBtn = document.getElementById('submitBtn');
    document.getElementById('declineBtn').addEventListener('click', function (e) {
        e.preventDefault();
        window.location.assign('/logout?reason=consent_declined');
    });
    checkbox.addEventListener('change', function () {
        submitBtn.disabled = !this.checked;
    });
</script>
<script src="/assets/js/notifications.js"></script>
</body>
</html>
