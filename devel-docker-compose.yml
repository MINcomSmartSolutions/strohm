services:
  db:
    container_name: strohm_db
    image: postgres:16.6
    restart:
      unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U ${POSTGRES_USER} -d postgres'" ]
      interval: 10s
      timeout: 3s
      retries: 3
    ports: # For development only, in production we don't need to expose the port
      - "5432:5432"
    environment:
      POSTGRES_DB: "postgres"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - main-db-data:/var/lib/postgresql/data

  server:
    container_name: strohm_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "127.0.0.1:${SERVER_PORT:-3000}:${SERVER_PORT:-3000}"
    restart:
      unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/usr/src/app
    environment:
      NODE_ENV: dev
      SERVER_PORT: ${SERVER_PORT:-3000}
      SERVER_OIDC_SECRET: ${SERVER_OIDC_SECRET}
      SERVER_OIDC_CLIENT_ID: ${SERVER_OIDC_CLIENT_ID}
      SERVER_OIDC_ISSUER_BASE_URL: ${SERVER_OIDC_ISSUER_BASE_URL}
      SERVER_OIDC_BASE_URL: ${SERVER_BASE_URL}
      SERVER_OIDC_CLIENT_SECRET: ${SERVER_OIDC_CLIENT_SECRET}
      STEVE_BASE_URL: http://steve_sim:8180/steve
      STEVE_AUTH_USERNAME: ${STEVE_AUTH_USERNAME}
      STEVE_API_PASSWORD: ${STEVE_API_PASSWORD}
      ODOO_API_SECRET: anothersecret
      ODOO_HOST: odoo
      ODOO_PORT: 8069
      ODOO_EXTERNAL_BASE_URL: http://localhost:18069
      WEBHOOK_API_KEY: webhook-api-key
      STROHM_DB_HOST: db
      STROHM_DB_NAME: ${STROHM_DB}
      STROHM_DB_USER: ${STROHM_DB_USER}
      STROHM_DB_PASSWORD: ${STROHM_DB_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      STROHM_DB_PORT: 5432
      TAILSCALE_ENABLE_ADMIN: true
      TAILSCALE_ALLOWED_IPS: ${TAILSCALE_ALLOWED_IPS}
    command: npm run debug

  odoo:
    container_name: strohm_odoo
    build:
      context: ./doodba/odoo
      args:
        DB_VERSION: "16"
        ODOO_VERSION: "18.0"
        AGGREGATE: "false"
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
        PIP_INSTALL_ODOO: 1
        CLEAN: "false"
        COMPILE: "false"
    environment:
      DOODBA_ENV: "devel"
      ODOO_ENV: "dev"
      LIST_DB: "true"
      PGHOST: db
      PGDATABASE: ${ODOO_DB}
      PGUSER: ${ODOO_DB_USER}
      PGPASSWORD: ${ODOO_DB_PASSWORD}
      ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD}
      PYTHONDONTWRITEBYTECODE: 1
      SMTP_PORT: "1025"
      ODOO_API_SECRET: anothersecret
      INITIAL_LANG: "de_DE"
      BACKEND_HOST: server
      BACKEND_PORT: ${SERVER_PORT:-3000}
      BACKEND_EXTERNAL_URL: ${SERVER_BASE_URL}
      WEBHOOK_API_KEY: webhook-api-key
      WITHOUT_DEMO: "all"
      PROXY_MODE: "false"
      DEBUGPY_ENABLE: 0
    tty: true
    ports:
      #      - "127.0.0.1:6899:6899" # Debugpy
      - "127.0.0.1:18069:8069"
      - "127.0.0.1:18072:8072"
    volumes:
      - ./doodba/odoo/custom:/opt/odoo/custom:ro,z
      - ./doodba/odoo/auto:/opt/odoo/auto:rw,z
      - odoo-web-data:/var/lib/odoo:z
    depends_on:
      db:
        condition: service_healthy
    command:
      - odoo
      - --limit-memory-soft=0
      - --limit-time-real-cron=9999999
      - --limit-time-real=9999999
      - --workers=0
      - --dev=reload,qweb,werkzeug,xml
      - -i strohm_addon

  steve-db:
    container_name: steve_sim_db
    image: mariadb:10.4.30
    ports:
      - "3306:3306"
    volumes:
      - steve-db-data:/var/lib/mysql
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: stevedb
      MYSQL_USER: steve
      MYSQL_PASSWORD: changeme

  steve:
    container_name: steve_sim
    build: ./steve
    links:
      - "steve-db:mariadb"
    volumes:
      - ./steve:/code
      - steve-jars:/root/.m2
    ports:
      - "8180:8180"
      - "8443:8443"
    depends_on:
      - steve-db

  ocpp-wallbox-sim:
    build:
      context: ./ocpp-wallbox-sim
      dockerfile: Dockerfile
    container_name: ocpp_wallbox_sim
    restart: unless-stopped
    ports:
      - "8090:80"


volumes:
  main-db-data:
  odoo-web-data: # filestore
  steve-db-data:
  steve-jars:

networks:
  default:
  public:
