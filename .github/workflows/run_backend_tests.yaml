name: Backend Tests

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/run_backend_tests.yaml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/run_backend_tests.yaml'

jobs:
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install dependencies
      working-directory: ./backend
      run: npm ci

    - name: Wait for PostgreSQL
      run: |
        until pg_isready -h localhost -p 5433 -U testuser; do
          echo "Waiting for PostgreSQL..."
          sleep 2
        done

    - name: Setup test database
      working-directory: ./backend
      env:
        DB_HOST: localhost
        DB_PORT: 5433
        DB_NAME: strohm
        DB_USER: testuser
        DB_PASSWORD: testpassword
      run: |
        # Make the database initialization script executable and run it
        chmod +x ./src/__tests__/helpers/db-init.sh
        ./src/__tests__/helpers/db-init.sh

    - name: Run unit tests
      working-directory: ./backend
      env:
        NODE_ENV: test
        LOG_LEVEL: error
      run: NODE_ENV=test npx jest --config=jest.config.js src/__tests__/unit --testPathIgnorePatterns=src/__tests__/helpers/ --verbose

    - name: Debug environment variables
      working-directory: ./backend
      env:
        NODE_ENV: test
        LOG_LEVEL: error
        DB_HOST: localhost
        DB_PORT: 5433
        DB_NAME: strohm
        DB_USER: testuser
        DB_PASSWORD: testpassword
      run: |
        echo "Environment variables:"
        echo "NODE_ENV=$NODE_ENV"
        echo "DB_HOST=$DB_HOST"
        echo "DB_PORT=$DB_PORT"
        echo "DB_NAME=$DB_NAME"
        echo "DB_USER=$DB_USER"
        echo "DB_PASSWORD=$DB_PASSWORD"

    - name: Run integration tests
      working-directory: ./backend
      env:
        NODE_ENV: test
        LOG_LEVEL: error
        # Database configuration
        DB_HOST: localhost
        DB_PORT: 5433
        DB_NAME: strohm
        DB_USER: testuser
        DB_PASSWORD: testpassword
        # Mock external services for integration tests
        STEVE_HOST: mock
        STEVE_PORT: 8080
        STEVE_AUTH_USERNAME: mockuser
        STEVE_API_PASSWORD: mockpass
        ODOO_HOST: mock
        ODOO_PORT: 8069
        ODOO_EXTERNAL_HOST: mock
        ODOO_EXTERNAL_PORT: 8069
        ODOO_API_SECRET: mock_secret
        ODOO_ADMIN_API_KEY: mock_api_key
        SERVER_OIDC_SECRET: mock_oidc_secret
        SERVER_OIDC_BASE_URL: http://localhost:3000
        SERVER_OIDC_CLIENT_ID: mock_client_id
        SERVER_OIDC_CLIENT_SECRET: mock_client_secret
        SERVER_OIDC_ISSUER_BASE_URL: http://localhost:9000
      run: |
        npx jest --config=jest.config.js src/__tests__/integration --testPathIgnorePatterns=src/__tests__/helpers/ --verbose

    - name: Run all tests with coverage
      working-directory: ./backend
      env:
        NODE_ENV: test
        DB_HOST: localhost
        DB_PORT: 5433
        DB_NAME: strohm
        DB_USER: testuser
        DB_PASSWORD: testpassword
        LOG_LEVEL: error
        # Mock external services
        STEVE_HOST: mock
        STEVE_PORT: 8080
        STEVE_AUTH_USERNAME: mockuser
        STEVE_API_PASSWORD: mockpass
        ODOO_HOST: mock
        ODOO_PORT: 8069
        ODOO_EXTERNAL_HOST: mock
        ODOO_EXTERNAL_PORT: 8069
        ODOO_API_SECRET: mock_secret
        ODOO_ADMIN_API_KEY: mock_api_key
        SERVER_OIDC_SECRET: mock_oidc_secret
        SERVER_OIDC_BASE_URL: http://localhost:3000
        SERVER_OIDC_CLIENT_ID: mock_client_id
        SERVER_OIDC_CLIENT_SECRET: mock_client_secret
        SERVER_OIDC_ISSUER_BASE_URL: http://localhost:9000
      run: |
        npx jest --config=jest.config.js src/__tests__/ --testPathIgnorePatterns=src/__tests__/helpers/ --verbose --coverage --coverageReporters=text --coverageReporters=lcov

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./backend/coverage/lcov.info
        directory: ./backend/coverage/
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Archive test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-node-${{ matrix.node-version }}
        path: |
          backend/coverage/
          backend/logs/

    - name: Comment coverage on PR
      if: github.event_name == 'pull_request'
      uses: 5monkeys/cobertura-action@master
      with:
        path: backend/coverage/cobertura-coverage.xml
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        minimum_coverage: 75
        fail_below_threshold: false