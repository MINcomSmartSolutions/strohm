name: Run Backend Tests and Build Image

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/run_backend_tests_and_build_image.yaml'

jobs:
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    strategy:
      matrix:
        node-version: [ 18.x, 20.x ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5433 -U testuser; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Setup test database
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          DB_NAME: strohm
          DB_USER: testuser
          DB_PASSWORD: testpassword
        run: |
          # Make the database initialization script executable and run it
          chmod +x ./src/__tests__/helpers/db-init.sh
          ./src/__tests__/helpers/db-init.sh

      - name: Run unit tests
        working-directory: ./backend
        env:
          NODE_ENV: test
          LOG_LEVEL: error
        run: NODE_ENV=test npx jest --config=jest.config.js src/__tests__/unit --testPathIgnorePatterns=src/__tests__/helpers/ --verbose

      - name: Debug environment variables
        working-directory: ./backend
        env:
          NODE_ENV: test
          LOG_LEVEL: error
          DB_HOST: localhost
          DB_PORT: 5433
          DB_NAME: strohm
          DB_USER: testuser
          DB_PASSWORD: testpassword
        run: |
          echo "Environment variables:"
          echo "NODE_ENV=$NODE_ENV"
          echo "DB_HOST=$DB_HOST"
          echo "DB_PORT=$DB_PORT"
          echo "DB_NAME=$DB_NAME"
          echo "DB_USER=$DB_USER"
          echo "DB_PASSWORD=$DB_PASSWORD"

      - name: Run integration tests
        working-directory: ./backend
        env:
          NODE_ENV: test
          LOG_LEVEL: error
          # Database configuration
          DB_HOST: localhost
          DB_PORT: 5433
          DB_NAME: strohm
          DB_USER: testuser
          DB_PASSWORD: testpassword
          # Mock external services for integration tests
          STEVE_HOST: mock
          STEVE_PORT: 8080
          STEVE_AUTH_USERNAME: mockuser
          STEVE_API_PASSWORD: mockpass
          ODOO_HOST: mock
          ODOO_PORT: 8069
          ODOO_EXTERNAL_HOST: mock
          ODOO_EXTERNAL_PORT: 8069
          ODOO_API_SECRET: mock_secret
          ODOO_ADMIN_API_KEY: mock_api_key
          SERVER_OIDC_SECRET: mock_oidc_secret
          SERVER_OIDC_BASE_URL: http://localhost:3000
          SERVER_OIDC_CLIENT_ID: mock_client_id
          SERVER_OIDC_CLIENT_SECRET: mock_client_secret
          SERVER_OIDC_ISSUER_BASE_URL: http://localhost:9000
        run: |
          npx jest --config=jest.config.js src/__tests__/integration --testPathIgnorePatterns=src/__tests__/helpers/ --verbose

      - name: Run all tests with coverage
        working-directory: ./backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5433
          DB_NAME: strohm
          DB_USER: testuser
          DB_PASSWORD: testpassword
          LOG_LEVEL: error
          # Mock external services
          STEVE_HOST: mock
          STEVE_PORT: 8080
          STEVE_AUTH_USERNAME: mockuser
          STEVE_API_PASSWORD: mockpass
          ODOO_HOST: mock
          ODOO_PORT: 8069
          ODOO_EXTERNAL_HOST: mock
          ODOO_EXTERNAL_PORT: 8069
          ODOO_API_SECRET: mock_secret
          ODOO_ADMIN_API_KEY: mock_api_key
          SERVER_OIDC_SECRET: mock_oidc_secret
          SERVER_OIDC_BASE_URL: http://localhost:3000
          SERVER_OIDC_CLIENT_ID: mock_client_id
          SERVER_OIDC_CLIENT_SECRET: mock_client_secret
          SERVER_OIDC_ISSUER_BASE_URL: http://localhost:9000
        run: |
          npx jest --config=jest.config.js src/__tests__/ --testPathIgnorePatterns=src/__tests__/helpers/ --coverage --coverageReporters=text --coverageReporters=lcov

      - name: Comment backend coverage
        if: github.event.pull_request
        uses: zgosalvez/github-actions-report-lcov@v4
        with:
          coverage-files: ./backend/coverage/lcov*.info
          artifact-name: backend-coverage-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          update-comment: true

  build:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: test
    if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mincomsmartsolutions/strohm_backend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
